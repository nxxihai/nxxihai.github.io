<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日新闻早报</title>
<meta http-equiv="refresh" content="0; url=/daily_news/">
<style>
:root{--bg:#f2f4f7;--card:#fff;--text:#14181f;--muted:#65707e;--accent:#2563eb;--line:#e4e8ee}
@media (prefers-color-scheme: dark){
  :root{--bg:#0d1014;--card:#161a20;--text:#e6e9ee;--muted:#98a2b0;--line:#242a33}
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--text);padding:24px;
  font:16px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.card{max-width:420px;width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:28px 24px;text-align:center;
  box-shadow:0 10px 30px -14px rgba(16,24,40,.22)}
h1{margin:0 0 6px;font-size:22px}
p{margin:0;color:var(--muted);font-size:14px}
a{display:inline-block;margin-top:16px;color:var(--accent);font-weight:600;text-decoration:none}
a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <h1>每日新闻早报</h1>
  <p>正在跳转到最新一期…</p>
  <a href="/daily_news/">没自动跳转？点这里 →</a>
</div>
</body>
</html>
